DISTRO_ID="centos7.9"
DISTRO_NAME="CentOS 7.9"
PKG_EXT="rpm"

APP_PACKAGES=(
    make git diffutils curl
    readline-devel libpcap-devel libaio-devel zlib-devel
    devtoolset-9-gcc devtoolset-9-gcc-c++
    # devtoolset-9-gcc pulls the system glibc-headers, which drags in
    # kernel-headers at the repo's *newest* version (3.10.0-1160.119.1.el7),
    # mismatching the target kernel and DRV's pinned kernel-headers below. Pin it
    # to the same version as DRV so there is a single, target-matching
    # kernel-headers that APP installs and cleanly removes; otherwise DRV's pinned
    # copy is version-skipped and `drv uninstall` can never clean the orphan.
    # MUST equal `uname -r` on the target.
    kernel-headers-3.10.0-1160.el7
)

# kernel-devel / kernel-headers are pinned to the target machine's running
# kernel (uname -r = 3.10.0-1160.el7.x86_64) so the offline drv package builds
# modules against a matching source tree, instead of the repo's newest update
# (3.10.0-1160.119.1.el7) which would not match a GA 7.9 install. The pinned
# version MUST equal `uname -r` on the install machine.
DRV_PACKAGES=(
    # unpinned (follows repo latest):
    # kernel-devel kernel-headers
    kernel-devel-3.10.0-1160.el7 kernel-headers-3.10.0-1160.el7
    elfutils-libelf-devel openssl-devel bc flex perl
)

# CMake 3.27 installed from binary in Dockerfile (yum version too old)
APP_EXTRA_TARS=("/opt/cmake")

# Fetch offline packages the same way the target machine resolves them:
# ask yum for the exact install transaction (packages NOT already present on a
# minimal system), take the resulting package NEVRAs, then download only those.
# This avoids pulling the full recursive dependency closure.
# Extracting name-version-release.arch (not just the name) preserves the
# kernel-devel/kernel-headers pin above: yumdownloader then grabs the exact
# resolved version instead of the repo's newest.
download_packages() {
    local dest="$1"; shift
    mkdir -p "$dest"

    local names
    names=$(yum install --assumeno "$@" 2>/dev/null \
        | awk '/^Installing/{f=1} /^Transaction Summary/{f=0} f' \
        | grep -E ' (x86_64|noarch|i686) ' \
        | awk '{print $1"-"$3"."$2}' | sort -u) || true

    if [ -z "$names" ]; then
        echo "Warning: no packages resolved for: $*"
        return
    fi

    echo "Downloading $(echo "$names" | wc -w) packages..."
    yumdownloader --archlist=x86_64,noarch --destdir="$dest" $names 2>&1 \
        | grep -v "^ignoring a dupe" || true
}
