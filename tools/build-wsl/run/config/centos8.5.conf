DISTRO_ID="centos8.5"
DISTRO_NAME="CentOS 8.5"
PKG_EXT="rpm"

APP_PACKAGES=(
    gcc gcc-c++ make cmake git diffutils
    readline-devel libpcap-devel libaio-devel zlib-devel
    # gcc -> glibc-devel -> glibc-headers drags in kernel-headers at the repo's
    # *newest* version (4.18.0-348.7.1.el8_5), which mismatches the target kernel
    # and DRV's pinned kernel-headers below. Without this explicit pin the two
    # scopes fight over kernel-headers: APP installs the newer one, DRV's pinned
    # copy is version-skipped, and `drv uninstall` can never clean it. Pinning the
    # same version as DRV makes one consistent, target-matching kernel-headers
    # that APP installs and cleanly removes. MUST equal `uname -r` on the target.
    kernel-headers-4.18.0-348.el8
)

# kernel-devel / kernel-headers are pinned to the target machine's running
# kernel (uname -r = 4.18.0-348.el8.x86_64) so the offline drv package builds
# modules against a matching source tree, instead of the repo's newest update
# which would not match the target kernel. The pinned version MUST equal
# `uname -r` on the install machine.
DRV_PACKAGES=(
    # unpinned (follows repo latest):
    # kernel-devel kernel-headers
    kernel-devel-4.18.0-348.el8 kernel-headers-4.18.0-348.el8
    elfutils-libelf-devel openssl-devel bc flex
)

# Fetch offline packages the same way the target machine resolves them:
# ask the installer for the exact transaction (packages NOT already present on a
# minimal system), take the resulting package NEVRAs, then download only those.
# This avoids pulling the full recursive dependency closure.
# install_weak_deps=False drops Recommends (e.g. cmake -> emacs) that a minimal
# server does not pull, matching the on-machine reference transaction.
# Extracting name-version-release.arch (not just the name) preserves the
# kernel-devel/kernel-headers pin above: yumdownloader then grabs the exact
# resolved version instead of the repo's newest.
download_packages() {
    local dest="$1"; shift
    mkdir -p "$dest"

    local names
    names=$(yum install --assumeno --setopt=install_weak_deps=False "$@" 2>/dev/null \
        | awk '/^Installing/{f=1} /^Transaction Summary/{f=0} f' \
        | grep -E ' (x86_64|noarch|i686) ' \
        | awk '{print $1"-"$3"."$2}' | sort -u) || true

    if [ -z "$names" ]; then
        echo "Warning: no packages resolved for: $*"
        return
    fi

    echo "Downloading $(echo "$names" | wc -w) packages..."
    yumdownloader --archlist=x86_64,noarch --destdir="$dest" $names || true
}
