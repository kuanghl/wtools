DISTRO_ID="ubuntu20.04"
DISTRO_NAME="Ubuntu 20.04"
PKG_EXT="deb"

APP_PACKAGES=(
    build-essential gcc g++ make cmake git diffutils
    libreadline-dev libpcap-dev libaio-dev zlib1g-dev
)

DRV_PACKAGES=(
    linux-headers-generic
    libelf-dev libssl-dev bc flex kmod
)

download_packages() {
    local dest="$1"; shift
    apt-get update -qq
    apt-get install --download-only --reinstall -y --no-install-recommends "$@"
    find /var/cache/apt/archives/ -maxdepth 1 -name '*.deb' -exec cp {} "$dest/" \;
}
