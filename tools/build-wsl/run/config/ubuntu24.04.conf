DISTRO_ID="ubuntu24.04"
DISTRO_NAME="Ubuntu 24.04"
PKG_EXT="deb"

APP_PACKAGES=(
    build-essential gcc g++ make cmake git diffutils
    libreadline-dev libpcap-dev libaio-dev zlib1g-dev
)

# Kernel headers are currently unpinned: linux-headers-generic is a meta package
# and always resolves to the repo's newest kernel. Ubuntu pins by the *concrete
# package name* (linux-headers-6.8.0-151-generic) rather than a versioned spec:
# the numbered name is fixed, and this concrete name is kept as-is by the apt
# transaction extraction below, so download_packages needs no version handling.
# Once the target machine is known, comment out the meta line and pin to its
# `uname -r`, so the offline drv package builds modules against a matching source
# tree instead of the repo's newest.
DRV_PACKAGES=(
    # unpinned (follows repo latest):
    # linux-headers-generic
    # pinned example — MUST equal `uname -r` on the install machine:
    linux-headers-6.8.0-151-generic
    libelf-dev libssl-dev bc flex kmod
)

# Fetch offline packages the same way the target machine resolves them:
# ask apt for the exact install transaction (packages NOT already present on a
# minimal system), take the resulting package names, then download only those.
# This avoids pulling the full recursive dependency closure.
download_packages() {
    local dest="$1"; shift
    mkdir -p "$dest"
    apt-get update -qq

    local names
    names=$(apt-get install -y --dry-run "$@" 2>/dev/null \
        | awk '/^Inst /{print $2}' | sort -u) || true

    if [ -z "$names" ]; then
        echo "Warning: no packages resolved for: $*"
        return
    fi

    echo "Downloading $(echo "$names" | wc -w) packages..."
    (cd "$dest" && apt-get download -o APT::Sandbox::User=root $names)
}
