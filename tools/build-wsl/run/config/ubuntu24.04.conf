DISTRO_ID="ubuntu24.04"
DISTRO_NAME="Ubuntu 24.04"
PKG_EXT="deb"

APP_PACKAGES=(
    build-essential gcc g++ make cmake git diffutils
    libreadline-dev libpcap-dev libaio-dev zlib1g-dev
)

DRV_PACKAGES=(
    linux-headers-generic
    libelf-dev libssl-dev bc flex kmod
)

# System-critical packages that should never be removed during uninstall
# These are essential for basic system operation and may be pulled in as dependencies
PROTECTED_PACKAGES=(
    coreutils bash libc6 libc-bin libc-dev-bin libc6-dev
    dpkg zlib1g zlib1g-dev libgcc-s1 libstdc++6
    ncurses-base ncurses-bin libncursesw6 libncurses6
    libssl3t64 openssl libkrb5-3
    base-files debianutils diffutils findutils grep gzip
    hostname login passwd sed sysvinit-utils tar util-linux
)

download_packages() {
    local dest="$1"; shift
    apt-get update -qq
    mkdir -p "$dest"

    local all_pkgs
    all_pkgs=$(apt-cache depends --recurse --no-recommends --no-suggests \
        --no-conflicts --no-breaks --no-replaces --no-enhances \
        "$@" | awk '
            # Top-level package names: line contains only a valid package name
            /^[a-zA-Z0-9][-a-zA-Z0-9+.]*$/ {
                print
                next
            }
            # Dependency lines: "  Depends: pkg" or "  PreDepends: pkg" or "  |Depends: pkg"
            /^[[:space:]]+\|?[[:space:]]*(Pre)?Depends:/ {
                # Skip virtual packages (those in angle brackets)
                if ($0 ~ /<[^>]+>/) next

                # Remove the prefix up to and including "Depends: " or "PreDepends: "
                sub(/^[[:space:]]*\|?[[:space:]]*(Pre)?Depends:[[:space:]]*/, "")
                # Remove pipes
                gsub(/\|/, "")
                # Remove architecture qualifiers like :any, :amd64
                gsub(/:.*$/, "")
                # Trim whitespace
                gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                # Filter out non-package words and validate package name format
                if ($0 != "" && $0 !~ /^(Depends|PreDepends)$/ && $0 ~ /^[a-zA-Z0-9][-a-zA-Z0-9+.]*$/) print
            }
        ' | sort -u)

    if [ -z "$all_pkgs" ]; then
        echo "Warning: No packages to download for: $*"
        return
    fi

    echo "Downloading $(echo "$all_pkgs" | wc -w) packages..."
    (cd "$dest" && apt-get download -o APT::Sandbox::User=root $all_pkgs)
}
