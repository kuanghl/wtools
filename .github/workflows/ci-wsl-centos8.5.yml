name: CI CentOS 8.5

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build-wsl-centos8.5:
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install qemu-utils

      - name: Checkout
        uses: actions/checkout@v2

      - name: Build
        run: |
          cd tools/build-wsl
          chmod +x ./build-wsl-centos8.5.sh
          ./build-wsl-centos8.5.sh
          mv wsl/dist/CentOS8.zip wsl/dist/CentOS-8.5-2105.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentOS-8.5-2105
          path: tools/build-wsl/wsl/dist/CentOS-8.5-2105.zip

      # - name: Release
