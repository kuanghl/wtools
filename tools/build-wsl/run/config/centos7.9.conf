DISTRO_ID="centos7.9"
DISTRO_NAME="CentOS 7.9"
PKG_EXT="rpm"

APP_PACKAGES=(
    make git diffutils curl
    readline-devel libpcap-devel libaio-devel zlib-devel
    devtoolset-9-gcc devtoolset-9-gcc-c++
)

DRV_PACKAGES=(
    kernel-devel kernel-headers
    elfutils-libelf-devel openssl-devel bc flex perl
)

# CMake 3.27 installed from binary in Dockerfile (yum version too old)
APP_EXTRA_TARS=("/opt/cmake")

download_packages() {
    local dest="$1"; shift
    yumdownloader --resolve --destdir="$dest" "$@"
}
