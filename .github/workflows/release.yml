name: Build and Release aria2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      aria2_ref:
        description: 'aria2 源码 ref（tag / 分支）'
        required: true
        default: 'master'

env:
  ARIA2_REPO: https://github.com/aria2/aria2.git
  ARIA2_REF: ${{ github.event.inputs.aria2_ref || github.ref_name || 'master' }}

jobs:
  # ==================================================================
  # prep-source：只做一次源码准备（下载 + autoreconf + 打包 artifact）
  # ==================================================================
  prep-source:
    name: Prepare aria2 source
    runs-on: ubuntu-24.04
    outputs:
      src-artifact: aria2-src
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint libtool gettext pkg-config

      - name: Prepare source bundle
        run: bash tools/build-aria2c/prep-source.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-src
          path: aria2-src.tar.gz
          retention-days: 3

  # ==================================================================
  # Linux：原生 runner
  # ==================================================================
  build-linux:
    name: Linux ${{ matrix.arch }}
    needs: prep-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: aria2-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config bison gperf \
            libssl-dev libexpat1-dev libsqlite3-dev \
            libc-ares-dev zlib1g-dev

      - name: Build
        run: bash tools/build-aria2c/build-linux.sh
        env:
          ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  # ==================================================================
  # macOS：原生 runner
  # ==================================================================
  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: prep-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: aria2-src

      - name: Install dependencies
        run: |
          brew install pkg-config openssl@3 expat c-ares

      - name: Build
        run: bash tools/build-aria2c/build-macos.sh
        env:
          ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  # ==================================================================
  # Windows：MSYS2 MINGW64 原生
  # ==================================================================
  build-windows:
    name: Windows x86_64
    needs: prep-source
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: aria2-src

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-zlib
            pkg-config

      - name: Build
        shell: msys2 {0}
        run: bash tools/build-aria2c/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-windows-x86_64
          path: dist/*.zip

  # ==================================================================
  # Release
  # ==================================================================
  release:
    name: Publish Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -not -name 'aria2-src.tar.gz' \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}