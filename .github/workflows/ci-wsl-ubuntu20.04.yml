name: CI Ubuntu 20.04

on:
  push:
    # branches:
    #   - master
    tags:
      - '*'
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build-wsl-ubuntu20_04:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install qemu-utils

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: |
          cd tools/build-wsl
          chmod +x ./build-wsl-ubuntu20.04.sh
          ./build-wsl-ubuntu20.04.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-20.04
          path: tools/build-wsl/wsl/dist/Ubuntu20.04.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: tools/build-wsl/wsl/dist/Ubuntu20.04.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
