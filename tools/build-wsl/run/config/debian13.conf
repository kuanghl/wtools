DISTRO_ID="debian13"
DISTRO_NAME="Debian 13"
PKG_EXT="deb"

APP_PACKAGES=(
    build-essential gcc g++ make cmake git diffutils
    libreadline-dev libpcap-dev libaio-dev zlib1g-dev
)

# Kernel headers are currently unpinned: linux-headers-amd64 is Debian's meta
# package (linux-headers-generic is Ubuntu naming and does not exist here) and
# always resolves to the repo's newest kernel. Pin the same way as the other deb
# distros, by the *concrete package name* — the versioned headers package Debian
# builds is named after the kernel, e.g. linux-headers-6.12.43+deb13-amd64, which
# MUST equal `uname -r` on the install machine. That concrete name is kept as-is
# by the apt transaction extraction below, so download_packages needs no version
# handling. Comment out the meta line and pin it once the target is known, so the
# offline drv package builds modules against a matching source tree.
DRV_PACKAGES=(
    # unpinned (follows repo latest):
    linux-headers-amd64
    # pinned example — MUST equal `uname -r` on the install machine:
    # linux-headers-6.12.43+deb13-amd64
    libelf-dev libssl-dev bc flex kmod
)

# Fetch offline packages the same way the target machine resolves them:
# ask apt for the exact install transaction (packages NOT already present on a
# minimal system), take the resulting package names, then download only those.
# This avoids pulling the full recursive dependency closure.
download_packages() {
    local dest="$1"; shift
    mkdir -p "$dest"
    apt-get update -qq

    local names
    names=$(apt-get install -y --dry-run "$@" 2>/dev/null \
        | awk '/^Inst /{print $2}' | sort -u) || true

    if [ -z "$names" ]; then
        echo "Warning: no packages resolved for: $*"
        return
    fi

    echo "Downloading $(echo "$names" | wc -w) packages..."
    (cd "$dest" && apt-get download -o APT::Sandbox::User=root $names)
}
