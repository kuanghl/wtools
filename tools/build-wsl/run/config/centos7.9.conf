DISTRO_ID="centos7.9"
DISTRO_NAME="CentOS 7.9"
PKG_EXT="rpm"

APP_PACKAGES=(
    make git diffutils curl
    readline-devel libpcap-devel libaio-devel zlib-devel
    devtoolset-9-gcc devtoolset-9-gcc-c++
)

DRV_PACKAGES=(
    kernel-devel kernel-headers
    elfutils-libelf-devel openssl-devel bc flex perl
)

# System-critical packages that should never be removed during uninstall
# These are essential for basic system operation and may be pulled in as dependencies
PROTECTED_PACKAGES=(
    coreutils bash glibc glibc-common
    filesystem setup zlib libgcc libstdc++ ncurses-libs ncurses-base
    openssl-libs krb5-libs libselinux libsepol pcre
)

# CMake 3.27 installed from binary in Dockerfile (yum version too old)
APP_EXTRA_TARS=("/opt/cmake")

download_packages() {
    local dest="$1"; shift
    mkdir -p "$dest"

    local all_pkgs
    all_pkgs=$(repoquery --archlist=x86_64,noarch --requires --resolve --recursive "$@" 2>/dev/null | sort -u)

    if [ -z "$all_pkgs" ]; then
        echo "Warning: No packages to download for: $*"
        return
    fi

    local count
    count=$(echo "$all_pkgs" | wc -w)
    echo "Downloading $count packages..."
    echo "Sample packages: $(echo "$all_pkgs" | head -10 | tr '\n' ' ')"
    echo "Please wait, downloading in background..."

    # Use yumdownloader (downloads all packages regardless of installation status)
    # Note: yumdownloader in CentOS 7 doesn't show per-file progress
    yumdownloader --archlist=x86_64,noarch --destdir="$dest" --resolve $all_pkgs "$@" 2>&1 | grep -v "^ignoring a dupe" || true
}
