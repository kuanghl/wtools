name: CI Ubuntu 20.04

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install qemu-utils

      - name: Checkout
        uses: actions/checkout@v2

      - name: Build
        run: |
          cd tools/build-wsl
          chmod +x ./build-wsl-ubuntu20.04.sh
          ./build-wsl-ubuntu20.04.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-20.04
          path: tools/build-wsl/wsl/dist/Ubuntu20.04.zip

